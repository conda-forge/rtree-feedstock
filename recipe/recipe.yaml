schema_version: 1

context:
  name: rtree
  version: "1.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/rtree-${{ version }}.tar.gz
  sha256: c6b1b3550881e57ebe530cc6cffefc87cd9bf49c30b37b894065a9f810875e46
  patches:
    - noarch.patch

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - libspatialindex
  run:
    - python >=${{ python_min }}
    - libspatialindex

tests:
  - python:
      imports:
        - rtree
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest
        - numpy
    files:
      source:
        - tests/
    script:
      - pytest tests/ -v

about:
  summary: R-Tree spatial index for Python GIS
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/Toblerity/rtree

extra:
  recipe-maintainers:
    - ocefpaf
    - hobu
    - mwtoews
